[project]
name = "stratify-ai"
version = "0.1.0"
description = "Stratify AI: Distributed Market Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "aio-pika>=9.5.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend", "workers"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = [
    "E501",    # Line length (handled gracefully, allows descriptive strings/queries)
    "E712",    # SQLAlchemy comparison to True/False (Model.col == True is idiomatic SQLAlchemy)
    "B008",    # FastAPI Query/Depends in argument defaults
    "BLE001",  # Blind exception catching in resilient fallback and scrapers
    "UP042",   # Enum inheritance (str, Enum) preserved for SQLAlchemy/Pydantic serialization
]
